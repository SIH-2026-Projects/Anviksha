[project]
name = "sih26067-ocean-backend"
version = "0.1.0"
description = "Server-side scientific backend for SIH26067 ocean model and observation visualization"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.8,<3.0",
    "scipy>=1.14,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "xarray>=2024.10,<2027.0",
    "netcdf4>=1.7,<2.0",
    "copernicusmarine>=2.4.1",
]

[project.optional-dependencies]
data = [
    "cf-xarray>=0.9,<1.0",
    "dask[array]>=2024.10,<2027.0",
]
serving = [
    "zarr>=2.18,<4.0",
    "xpublish>=0.4,<1.0",
]
database = [
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "geoalchemy2>=0.15,<1.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_backend"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
